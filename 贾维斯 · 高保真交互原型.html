function pauseTask(id){const t=task(id);if(!t||t.mode==='observe')return toast('只读跟踪会话由本人控制。',true);t.resumePhase=t.status==='validating'?'validating':'running';t.status='paused';t.log.push(now()+' 用户主动暂停，监督器不自动恢复');t.updated=now();record('暂停：'+t.title,'任务 '+id,'已暂停');save();toast('已暂停，直到你手动恢复。')}
function resumeTask(id){const t=task(id);if(!t||t.mode==='observe')return toast('只读跟踪会话不能由管家续作。',true);if(S.settings.emergency)return toast('请先解除全局急停。',true);if(['approval','completed','cancelled'].includes(t.status))return toast('该任务当前不能恢复执行。',true);if(t.dependsOn&&task(t.dependsOn)?.status!=='completed')return toast('请先完成或处理前置里程碑任务。',true);if(machine(t.machine)?.status!=='online'){t.status='waitingResource';t.blockReason='执行节点尚未在线';save();return toast('已记录恢复请求，等待节点。')}const dailyLimit=totalCost()+1.35>S.settings.dailyBudget;if(t.budget&&t.cost+1.35>t.budget||dailyLimit){t.status='waitingQuota';t.blockReason=dailyLimit?'达到每日总预算':'达到任务费用上限';save();return show(dailyLimit?'budget':'task-budget',dailyLimit?'':id)}t.status=t.resumePhase|| (t.step===3?'validating':'running');t.blockReason='';t.updated=now();t.log.push(now()+' 按原目标恢复执行');record('恢复：'+t.title,'任务 '+id);save();toast('任务已恢复执行。')}
function advanceDemo(silent=false){
 if(!admin()&&!silent)return toast('此操作属于管理范围。',true);
 if(S.settings.emergency||!S.settings.supervise){if(!silent)toast('监督已暂停或急停，任务保持当前状态。');return}
 let changed=0;
 S.tasks.forEach(t=>{if(t.mode==='observe'||!['running','validating','queued','waitingResource'].includes(t.status))return;if(t.dependsOn&&task(t.dependsOn)?.status!=='completed'){if(['cancelled','failed'].includes(task(t.dependsOn)?.status)){t.status='blocked';t.blockReason='前置任务未通过，等待重新规划'}return}if(machine(t.machine)?.status!=='online'){if(t.status==='validating')t.resumePhase='validating';t.status='waitingResource';t.blockReason='等待节点恢复';return}if(totalCost()+1.35>S.settings.dailyBudget||t.budget&&t.cost+1.35>t.budget){t.status='waitingQuota';t.blockReason=totalCost()+1.35>S.settings.dailyBudget?'达到每日总预算':'达到任务费用上限';changed++;return}if(['queued','waitingResource'].includes(t.status)){t.status=t.resumePhase||'running';t.log.push(now()+' 节点就绪，开始执行');changed++;return}t.step=Math.min(4,t.step+1);t.progress=t.step===4?100:Math.max(t.progress,Math.min(94,Math.round(t.step*23)));t.cost=Math.round((t.cost+1.35)*100)/100;t.updated=now();t.log.push(now()+' '+(t.step===4?'验证通过，归档产出':t.step===3?'开始验收，收集测试与变更':'继续当前目标'));t.status=t.step===4?'completed':t.step===3?'validating':'running';if(t.step===4){t.tests='全部阶段验收通过';t.artifacts=[...new Set(t.artifacts.concat(['验收报告.md','变更与产出摘要.txt']))];record('验收完成：'+t.title,'任务 '+t.id,'通过','监督器');const p=project(t.project);if(p&&t.milestone>=0&&t.milestone<p.milestones.length){p.doneMilestones=[...new Set((p.doneMilestones||[]).concat([t.milestone]))].filter(i=>i>=0&&i<p.milestones.length);p.progress=Math.min(100,Math.round(p.doneMilestones.length/p.milestones.length*100))}}changed++});
 persist();if(!document.activeElement.matches('input,textarea,select'))render();if(!silent)toast(changed?'已推进 '+changed+' 项模拟任务。':'没有可以推进的托管任务。');
}

function handleAction(act,id,el){
 switch(act){
 case 'nav':navigate(id);break;case 'task':case 'machine':show(act,id);break;case 'profiles':show('profiles');break;case 'switch-profile':S.profile=id;persist();U.overlay=null;navigate(admin()?'overview':'family');toast('已切换到 '+P().name+' 的空间。');break;

 case 'close-overlay':closeOverlay();break;case 'menu':U.menu=!U.menu;document.getElementById('sidebar').classList.toggle('open',U.menu);document.getElementById('mobile-mask').classList.toggle('open',U.menu);break;case 'close-menu':U.menu=false;document.getElementById('sidebar').classList.remove('open');document.getElementById('mobile-mask').classList.remove('open');break;

 case 'artifact':{const [tid,name]=id.split('|'),t=task(tid);download(name,'# '+name+'\n\n交互原型模拟产出\n项目：'+project(t.project)?.name+'\n目标：'+t.goal+'\n状态：'+(taskStates[t.status]?.[0]||t.status)+'\n测试：'+t.tests+'\n\n'+t.log.join('\n'));toast('已生成模拟产出文件。');break}
 default:show(act,id);
 }

function attachSkill(t,k){
 if(!k||k.kind!=='skill'||!k.verified||k.status!=='可用')return false;
 t.skillRefs=t.skillRefs||[];if(t.skillRefs.some(r=>r.id===k.id&&r.version===k.version))return false;

}

const workflowAction=handleAction;
handleAction=function(act,id='',el){
 if(!allowedAction(act,id))return toast('这个操作属于管理范围，当前身份无法执行。',true);
 if(act==='simulate-failure'){
 const t=task(id);if(t.mode==='observe'||['completed','cancelled','approval','paused','waitingResource','waitingQuota'].includes(t.status))return toast('请在可执行阶段模拟验证失败。',true);
 t.retries++;t.tests='验证未通过 · 示例';t.log.push(now()+' 示例验证失败，第 '+t.retries+' 次尝试');
 if(t.retries>=t.retryLimit){t.status='blocked';t.blockReason='达到有限重试上限，需要处理失败原因';record('任务重复失败转为阻塞',t.title,'等待处理')}
 else{t.status='running';t.step=Math.max(1,t.step-1);record('有限重试',t.title,t.retries+' / '+t.retryLimit)}
 save();return toast(t.status==='blocked'?'已停止继续尝试，请补充处理信息。':'已记录一次失败，仍在有限重试范围内。');
 }
 if(act==='deprecate-skill'){const k=item(id);k.status='已废弃';k.history=k.history||[];k.history.unshift(k.version+' 已停用 · '+now());record('停用 Skill：'+k.title,'知识 '+id);save();return toast('新任务不再选择此版本，既有使用记录保留。')}
 if(act==='restore-drill'&&id==='r2')return createApproval('执行运行配置变更手册','i3-01 · 示例运行配置','按照运行手册执行配置调整，准备变更前快照，验证健康状态并保留回滚入口。');
 return workflowAction(act,id,el);
};
document.addEventListener('submit',event=>{
 const form=event.target.closest('form[data-form]');if(!form)return;
 const name=form.dataset.form;if(!['plan','environment','merge'].includes(name))return;
 event.preventDefault();if(!admin())return toast('当前身份无法执行。',true);
 const f=Object.fromEntries(new FormData(form)),id=form.dataset.id,p=project(id);
 if(name==='environment'){p.environment=f;record('保存项目环境资料',p.name);closeOverlay();save();show('project',p.id);return}
 if(name==='merge'){
 const source=item(id),target=item(f.target);if(!source||!target||source.id===target.id)return toast('请选择另一条经验。',true);
 target.content+='\n\n合并来源 '+source.id+'：'+source.title+'\n'+source.content;target.tags=[...new Set(target.tags.concat(source.tags))];target.mergedSources=(target.mergedSources||[]).concat([source.id]);target.verified=false;target.status='待验证';S.knowledge=S.knowledge.filter(k=>k.id!==source.id);record('合并经验并要求重新验证',target.title);closeOverlay();persist();show('knowledge-detail',target.id);render();return;
 }
 if(name==='plan'){
 const remaining=p.milestones.map((title,index)=>({title,index})).filter(m=>!p.doneMilestones.includes(m.index));
 if(S.tasks.some(t=>t.project===id&&t.planId&&!['completed','cancelled','failed'].includes(t.status)))return toast('此项目已有托管里程碑计划，请先处理当前计划。',true);
 const planId='plan'+Date.now(),m=machine(f.machine),tasks=[];let previous=null;
 remaining.forEach((milestone,i)=>{const tid='t'+Date.now()+'-'+i,t={id:tid,planId,dependsOn:previous,title:p.name+' · '+milestone.title,project:id,machine:m.id,agent:f.agent,mode:'managed',status:S.settings.emergency?'paused':i===0?(m.status==='online'?'running':'waitingResource'):'queued',step:0,progress:0,budget:Number(f.budget),cost:0,retries:0,retryLimit:S.settings.retryLimit,goal:milestone.title,criteria:f.criteria,skills:[],skillRefs:[],log:[now()+' 按项目里程碑计划登记'+(i?'，等待前置任务验收':'，准备执行')],artifacts:[],tests:'尚未进入验证',updated:now(),session:f.agent.toLowerCase().replace(/\s/g,'-')+'-demo-'+tid,worktree:'/worktrees/'+id+'/'+tid,milestone:milestone.index};tasks.push(t);previous=tid});
 S.tasks.unshift(...tasks);record('托管项目剩余 '+remaining.length+' 个里程碑',p.name,'已登记');closeOverlay();persist();navigate('tasks');if(m.status!=='online'&&S.settings.autoWake&&!S.settings.emergency)changeMachine(m.id,true);toast('计划已登记，每项验收后继续下一项。');
 }
});
const authoringOverlay=renderOverlay;
renderOverlay=function(){
 const o=U.overlay;if(!o)return;
 if(o.type==='edit-memory')return modal('修改个人记忆',formStart('memory',o.id)+field('希望管家记住的偏好','text',S.memories[S.profile][Number(o.id)],'textarea','required')+formEnd(),formFooter('保存修改','memory'));
 if(o.type==='skill-version'){
 const [kid,version]=o.id.split('|'),k=item(kid),v=k?.versions?.find(v=>v.version===version);
 if(!admin()||!v)return toast('此版本快照不在当前可见范围内。',true);
 return modal(k.title+' · '+v.version,'<div class="notice mb20">'+I('history',20)+'已存档版本，任务使用记录仍指向这个版本。</div><p class="muted">'+E(v.summary)+'</p><div class="code-block mt24">'+E(v.content)+'</div>',B('回到当前条目','knowledge-detail',k.id,'primary'),true);
 }
 authoringOverlay();
 if(['new-experience','edit-knowledge','task-experience','generate-skill','version-skill'].includes(o.type)){
 const grid=document.querySelector('#overlay-root .form-grid'),k=item(o.id);
 if(grid)grid.insertAdjacentHTML('beforeend',field('来源链接（可选）','link',k?.link||'','url')+'<label class="field"><span>导入本地文字资料（可选）</span><input class="input" type="file" data-file="knowledge" accept=".txt,.log,.md,.json"><span class="help">可读取日志、经验文档或已有 Skill；保存在此原型中。</span></label><input type="hidden" name="attachmentName" value="">');
 }
 if(o.type==='memories')document.querySelectorAll('#overlay-root [data-act="forget-memory"]').forEach(button=>button.insertAdjacentHTML('beforebegin',B('编辑','edit-memory',button.dataset.id,'compact','edit')));
};
const authoringAction=handleAction;
handleAction=function(act,id='',el){if(act==='open-link'){if(!/^https?:\/\//i.test(id))return toast('仅支持 http 或 https 来源链接。',true);window.open(id,'_blank','noopener,noreferrer');return}return authoringAction(act,id,el)};
document.addEventListener('change',async event=>{
 const input=event.target;if(input.dataset.file!=='knowledge')return;
 const file=input.files?.[0];if(!file)return;if(file.size>512*1024)return toast('演示支持 512KB 以内的文字资料，请选择较小的文件。',true);
 const form=input.closest('form'),profileId=S.profile,text=await file.text();
 if(!form.isConnected||profileId!==S.profile)return;
 const content=form.querySelector('[name="content"]');content.value+=(content.value?'\n\n':'')+'导入资料：'+file.name+'\n'+text;
 if(!form.querySelector('[name="title"]').value)form.querySelector('[name="title"]').value=file.name.replace(/\.[^.]+$/,'');
 if(!form.querySelector('[name="summary"]').value)form.querySelector('[name="summary"]').value='来自 '+file.name+' 的文字资料';
 form.querySelector('[name="attachmentName"]').value=file.name;toast('已读取资料，可编辑整理后保存。');
});
const accessibleShow=show;
show=function(type,id='',extra={}){U.returnFocus=document.activeElement;accessibleShow(type,id,extra);setTimeout(()=>{if(U.overlay?.type!==type)return;const dialog=document.querySelector('[role="dialog"]');(dialog?.querySelector('input:not([type="hidden"]),textarea,select,[autofocus]')||dialog?.querySelector('button'))?.focus()},80)};
const accessibleClose=closeOverlay;
closeOverlay=function(){const focused=U.returnFocus;accessibleClose();if(focused?.isConnected)focused.focus()};
document.addEventListener('keydown',event=>{
 if(event.key!=='Tab'||!U.overlay)return;
 const dialog=document.querySelector('[role="dialog"]'),nodes=dialog?[...dialog.querySelectorAll('button:not(:disabled),a[href],input:not([type="hidden"]):not(:disabled),textarea,select')].filter(n=>n.getClientRects().length):[];
 if(!nodes.length)return;const first=nodes[0],last=nodes[nodes.length-1];
 if(event.shiftKey&&(document.activeElement===first||!dialog.contains(document.activeElement))){event.preventDefault();last.focus()}
 else if(!event.shiftKey&&(document.activeElement===last||!dialog.contains(document.activeElement))){event.preventDefault();first.focus()}
});
if(!admin())U.route='family';
render();
</script>
