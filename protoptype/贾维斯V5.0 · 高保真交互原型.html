function pauseTask(id){const t=task(id);if(!t||t.mode==='observe')return toast('只读跟踪会话由本人控制。',true);t.resumePhase=t.status==='validating'?'validating':'running';t.status='paused';t.log.push(now()+' 用户主动暂停，监督器不自动恢复');t.updated=now();record('暂停：'+t.title,'任务 '+id,'已暂停');save();toast('已暂停，直到你手动恢复。')}
function resumeTask(id){const t=task(id);if(!t||t.mode==='observe')return toast('只读跟踪会话不能由管家续作。',true);if(S.settings.emergency)return toast('请先解除全局急停。',true);if(['approval','completed','cancelled'].includes(t.status))return toast('该任务当前不能恢复执行。',true);if(t.dependsOn&&task(t.dependsOn)?.status!=='completed')return toast('请先完成或处理前置里程碑任务。',true);if(machine(t.machine)?.status!=='online'){t.status='waitingResource';t.blockReason='执行节点尚未在线';save();return toast('已记录恢复请求，等待节点。')}const dailyLimit=totalCost()+1.35>S.settings.dailyBudget;if(t.budget&&t.cost+1.35>t.budget||dailyLimit){t.status='waitingQuota';t.blockReason=dailyLimit?'达到每日总预算':'达到任务费用上限';save();return show(dailyLimit?'budget':'task-budget',dailyLimit?'':id)}t.status=t.resumePhase|| (t.step===3?'validating':'running');t.blockReason='';t.updated=now();t.log.push(now()+' 按原目标恢复执行');record('恢复：'+t.title,'任务 '+id);save();toast('任务已恢复执行。')}
function advanceDemo(silent=false){
 if(!admin()&&!silent)return toast('此操作属于管理范围。',true);
 if(S.settings.emergency||!S.settings.supervise){if(!silent)toast('监督已暂停或急停，任务保持当前状态。');return}
 let changed=0;
 S.tasks.forEach(t=>{if(t.mode==='observe'||!['running','validating','queued','waitingResource'].includes(t.status))return;if(t.dependsOn&&task(t.dependsOn)?.status!=='completed'){if(['cancelled','failed'].includes(task(t.dependsOn)?.status)){t.status='blocked';t.blockReason='前置任务未通过，等待重新规划'}return}if(machine(t.machine)?.status!=='online'){if(t.status==='validating')t.resumePhase='validating';t.status='waitingResource';t.blockReason='等待节点恢复';return}if(totalCost()+1.35>S.settings.dailyBudget||t.budget&&t.cost+1.35>t.budget){t.status='waitingQuota';t.blockReason=totalCost()+1.35>S.settings.dailyBudget?'达到每日总预算':'达到任务费用上限';changed++;return}if(['queued','waitingResource'].includes(t.status)){t.status=t.resumePhase||'running';t.log.push(now()+' 节点就绪，开始执行');changed++;return}t.step=Math.min(4,t.step+1);t.progress=t.step===4?100:Math.max(t.progress,Math.min(94,Math.round(t.step*23)));t.cost=Math.round((t.cost+1.35)*100)/100;t.updated=now();t.log.push(now()+' '+(t.step===4?'验证通过，归档产出':t.step===3?'开始验收，收集测试与变更':'继续当前目标'));t.status=t.step===4?'completed':t.step===3?'validating':'running';if(t.step===4){t.tests='全部阶段验收通过';t.artifacts=[...new Set(t.artifacts.concat(['验收报告.md','变更与产出摘要.txt']))];record('验收完成：'+t.title,'任务 '+t.id,'通过','监督器');const p=project(t.project);if(p&&t.milestone>=0&&t.milestone<p.milestones.length){p.doneMilestones=[...new Set((p.doneMilestones||[]).concat([t.milestone]))].filter(i=>i>=0&&i<p.milestones.length);p.progress=Math.min(100,Math.round(p.doneMilestones.length/p.milestones.length*100))}}changed++});
 persist();if(!document.activeElement.matches('input,textarea,select'))render();if(!silent)toast(changed?'已推进 '+changed+' 项模拟任务。':'没有可以推进的托管任务。');
}
function changeMachine(id,on){const m=machine(id);if(!m||m.readOnly)return toast('该设备只接入指定项目状态。',true);if(on){m.status='waking';save();toast('正在模拟唤醒 '+m.name);setTimeout(()=>{m.status='online';m.cpuUse=12;m.ramUse=25;m.watts=25;m.last='刚刚';record('节点就绪：'+m.name,'设备 '+m.id,'完成','唤醒服务');save();if(admin())toast('节点已在线，等待节点的任务可以开始。')},1100)}else{m.status='offline';m.cpuUse=0;m.ramUse=0;m.watts=0;m.last=now();S.tasks.filter(t=>t.machine===id&&['running','validating'].includes(t.status)).forEach(t=>{t.resumePhase=t.status==='validating'?'validating':'running';t.status='waitingResource';t.blockReason='执行节点离线；保存最近工作状态';t.log.push(now()+' 节点离线，等待连接恢复')});record('模拟离线：'+m.name,'设备 '+m.id,'离线');save();toast('节点已离线，其他节点上的任务不受影响。')}}
function download(name,text){const blob=new Blob([text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function handleAction(act,id,el){
 switch(act){
 case 'nav':navigate(id);break;case 'task':case 'machine':show(act,id);break;case 'profiles':show('profiles');break;case 'switch-profile':S.profile=id;persist();U.overlay=null;navigate(admin()?'overview':'family');toast('已切换到 '+P().name+' 的空间。');break;
 case 'brief':show('brief');break;case 'screen':U.screenType=admin()?'manage':'family';navigate('screen');break;
 case 'close-overlay':closeOverlay();break;case 'menu':U.menu=!U.menu;document.getElementById('sidebar').classList.toggle('open',U.menu);document.getElementById('mobile-mask').classList.toggle('open',U.menu);break;case 'close-menu':U.menu=false;document.getElementById('sidebar').classList.remove('open');document.getElementById('mobile-mask').classList.remove('open');break;
 case 'machine-filter':U.filter=id;render();break;case 'machine-view':U.view=id;render();break;case 'task-filter':U.filter=id;render();break;case 'task-view':U.taskView=id;render();break;case 'detail-tab':U.detailTab=id;renderOverlay();break;
 case 'pause-task':pauseTask(id);break;case 'resume-task':resumeTask(id);break;case 'advance':advanceDemo();break;case 'offline-machine':changeMachine(id,false);break;case 'wake-machine':changeMachine(id,true);break;
 case 'toggle-supervise':if(S.settings.emergency)return toast('解除急停后再开启监督。',true);S.settings.supervise=!S.settings.supervise;save();toast(S.settings.supervise?'已开启监督。':'已暂停监督派发。');break;
 case 'artifact':{const [tid,name]=id.split('|'),t=task(tid);download(name,'# '+name+'\n\n交互原型模拟产出\n项目：'+project(t.project)?.name+'\n目标：'+t.goal+'\n状态：'+(taskStates[t.status]?.[0]||t.status)+'\n测试：'+t.tests+'\n\n'+t.log.join('\n'));toast('已生成模拟产出文件。');break}
 default:show(act,id);
 }
}

 function pagesReview(b){const page=Number(U.kv5Page)||1;return '<div class="card card-pad"><div class="row wrap between"><div><h2>逐页人工精校</h2><p class="subtitle">经典样卷采用逐页精校。疑点审核与整页复核分别记录。</p></div>'+badge(b.reviewed.length+'/'+b.pages+' 已复核',b.reviewed.length===b.pages?'green':'blue')+'</div><div class="kv5-pagelist">'+Array.from({length:b.pages},(_,i)=>i+1).map(p=>'<button data-act="v5-k-page" data-id="'+p+'" class="'+(b.reviewed.includes(p)?'checked ':'')+(b.doubts.some(q=>q.page===p&&q.status!=='resolved')?'doubt ':'')+(p===page?'active':'')+'">第 '+p+' 页</button>').join('')+'</div><div class="kv5-review" style="padding:0">'+pageFacsimile(b,null)+'<div class="kv5-stack"><h3>当前第 '+page+' 页</h3><div class="kv5-reading">'+E(b.id==='bk1'?sampleQuotes[(page-1)%3]:b.text)+'</div><div class="notice">'+I('info',18)+'原图、忠实转录与现代释义分别保存。示例批量完成按钮只模拟人工流程，不代表 AI 可替代真实逐页审核。</div><div class="head-actions">'+button(b.reviewed.includes(page)?'本页已复核':'确认本页精校','review-page',b.id+'|'+page,b.reviewed.includes(page)?'green-btn':'primary','check')+button('模拟完成全卷精校','review-all',b.id,'','tasks')+'</div></div></div></div>';}

  const originalProjectDetails=projectDetails;

  J5.boards.operations={title:'运行与资源指挥屏',subtitle:'服务健康、发布过程、恢复与机器资源',render(){

    return header+'<div class="grid4 mb20">'+metric('在线资产',S.machines.filter(m=>m.status==='online').length+' / '+S.machines.length,'资产完整登记，按需运行','machine','',false)+metric('推进中的目标',activeTasks().length,'研发执行 / 验证','code','green',false)+metric('知识生产',snapKnow.metrics?.[0]?.value||'进行中',snapKnow.metrics?.[0]?.label||'校对与故事发布','book','purple',false)+metric('需要决定',pendingApprovals().length,'具体对象与影响可检查','shield','amber',false)+'</div><div class="j5-command-cols"><section class="j5-board-panel j5-map-panel"><div class="row between"><h2>一个中枢 · 全域协作</h2>'+badge('事件驱动 · 模拟','blue')+'</div>'+topology()+'<div class="j5-map-foot"><span><i></i>语音与家庭优先</span><span><i></i>本人配额受到保护</span><span><i></i>目标与版本可追溯</span></div></section><section class="j5-board-panel"><div class="row between mb20"><h2>正在推进</h2>'+B('研发大屏','v5-board','development','compact')+'</div>'+S.tasks.filter(t=>!['completed','cancelled'].includes(t.status)).slice(0,4).map(taskRow).join('')+'<h2 class="mt24">运行与交付</h2><p class="small muted mt16">'+E(snapOps.summary)+'</p>'+state().deployments.filter(d=>['requested','verifying','failed'].includes(d.status)).slice(0,2).map(d=>'<div class="op5-board-service"><div class="grow"><strong>'+E(svc(d.service)?.name)+'</strong><small>'+E(d.version)+'</small></div>'+badge(dLabel(d),'amber')+B('过程','v5-op-deployment',d.id,'compact')+'</div>').join('')+'</section></div><div class="j5-screen-domain-grid mt20">'+domainInfo.map(d=>{const snap=J5.summary(d[0]);return '<button class="j5-screen-domain" data-act="v5-board" data-id="'+d[0]+'"><span class="j5-domain-icon">'+I(d[2],21)+'</span><div class="grow"><h3>'+d[1]+'</h3><p>'+E(snap.summary)+'</p><small>'+(snap.metrics||[]).slice(0,2).map(m=>E(m.label)+' '+E(m.value)).join(' · ')+'</small></div><span>'+I('arrow',18)+'</span></button>'}).join('')+'</div><div class="j5-screen-footer"><span class="j5-live-dot"></span>集合大屏仅显示当前身份可见的领域汇总 · 全部指标为模拟</div>';
  };

    if(['Enter',' '].includes(e.key)&&e.target.matches('.j5-topology-node')){e.preventDefault();handleAction('v5-board',e.target.dataset.id,e.target)}

})();

J5.init(); S.settings.supervise=false; if(!admin()){U.route='chat';J5.state().terminal=true} if(location.hash==='#voice'){U.route='chat';J5.state().terminal=true} if(location.hash==='#control'&&admin()){U.route='overview';J5.state().terminal=false} if(location.hash==='#screen'){U.route='screen';J5.state().board=admin()?'all':'family'} render();
</script>
